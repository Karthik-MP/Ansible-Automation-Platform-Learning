- name: Install Apache on web servers
  ansible.builtin.package:
    name: "{{ apache_package_name }}"
    state: present 
  when: inventory_hostname in groups['web'] # controlling which host the package will be installed on

- name: Ensure Apache is started and running
  ansible.builtin.service:
    name: "{{ apache_package_name }}"
    state: started
    enabled: true
  when: inventory_hostname in groups['web']
      
- name: Install firewalld on web servers
  ansible.builtin.package:
    name: firewalld
    state: present 
  when: inventory_hostname in groups['web']
  
- name: Ensure firewalld is started and running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: inventory_hostname in groups['web']

- name: Allow http and https traffic on web servers
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
  when: inventory_hostname in groups['web'] 
  notify: Reload firewalld # Notifying the handler to reload firewalld

- name: Deploy index.html to web servers
  ansible.builtin.template:
    src: templates/index.html.j2
    dest: /var/www/html/index.html